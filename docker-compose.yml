
services:
  backend:
    build: ./backend
    container_name: cloudops-backend
    restart: unless-stopped
    environment:
      PORT: 5000
    expose:
      - "5000"

  frontend:
    build: ./frontend
    container_name: cloudops-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
